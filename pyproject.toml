[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "nanodecision2"
version = "0.3.1"
description = "Trainable typed probabilistic decisions with a standalone C++ CPU runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["tokenizers>=0.21,<1"]

[project.optional-dependencies]
train = ["torch>=2.7,<3", "numpy>=1.26", "safetensors>=0.5", "huggingface-hub>=0.30"]
verify = ["transformers>=4.55,<5"]
data = ["datasets>=3,<5"]
test = ["pytest>=8"]
auto = ["torch>=2.7,<3", "numpy>=1.26,<3", "safetensors>=0.5,<1", "huggingface-hub>=0.34,<1", "transformers>=4.55,<5", "pyarrow>=19,<24"]

[project.scripts]
nd2 = "nanodecision2.cli:main"

[tool.setuptools]
packages = ["nanodecision2"]

[tool.setuptools.package-data]
nanodecision2 = ["recipes/*.json"]

[project.urls]
Repository = "https://github.com/jsk1004ha/NanoDecision"
Issues = "https://github.com/jsk1004ha/NanoDecision/issues"
Documentation = "https://github.com/jsk1004ha/NanoDecision/blob/main/README_ko.md"
