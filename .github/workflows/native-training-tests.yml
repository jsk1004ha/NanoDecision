name: Native and training regression tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-training-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Save exact reviewed source
        run: |
          git archive --format=zip HEAD -o "$RUNNER_TEMP/nanodecision-source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: nanodecision-reviewed-source
          path: |
            ${{ runner.temp }}/nanodecision-source.zip
            ${{ runner.temp }}/source-commit.txt
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,verify,data,test]'
      - name: Run regression tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Check source syntax
        run: |
          python -m compileall -q nanodecision2 tests
          bash -n run_all.sh
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanodecision-test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14
